name: Update Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update prices
        run: |
          python scripts/update_prices.py

      - name: Build dashboard
        run: |
          python scripts/build_dashboard_json.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/prices.json
          git add docs/dashboard.json

          git diff --cached --quiet || git commit -m "Auto update prices"

      - name: Push changes
        run: |
          git push
